<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warnings — Prop65 Shield</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body data-page="warnings" data-eyebrow="Compliance" data-title="Warnings.">
  <div class="layout">
    <div id="sidebar-slot"></div>
    <main class="main">
      <div id="topbar-slot"></div>
      <section class="panel">
        <div class="panel-header">
          <h2>Generated warnings</h2>
        </div>
        <p class="user-line" style="margin-bottom:20px">
          Every warning is generated by Prop65 Shield based on the ingredients and category of each product in your list.
        </p>
        <div id="warnings-list">
          <div class="empty">Loading…</div>
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/matcher.js"></script>
  <script src="js/warning-generator.js"></script>
  <script src="js/db.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/page-warnings.js"></script>
</body>
</html>
