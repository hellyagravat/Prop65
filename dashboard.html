<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0d12;
            color: #fff;
            display: flex
        }

        .sidebar {
            width: 250px;
            background: #11151d;
            height: 100vh;
            padding: 24px;
            position: fixed
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #f5c542
        }

        .menu a {
            display: block;
            color: #ddd;
            text-decoration: none;
            padding: 12px;
            border-radius: 10px;
            margin: 8px 0
        }

        .menu a:hover,
        .active {
            background: #1b2330
        }

        .main {
            margin-left: 250px;
            padding: 30px;
            width: calc(100%-250px)
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 20px 0
        }

        .card,
        .panel {
            background: #151a23;
            border: 1px solid #283040;
            border-radius: 16px;
            padding: 20px
        }

        .num {
            font-size: 34px;
            color: #f5c542
        }

        .grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px
        }

        .chat {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #f5c542;
            color: #111;
            padding: 15px 20px;
            border-radius: 30px;
            cursor: pointer
        }

        .toast {
            display: none;
            position: fixed;
            top: 20px;
            right: 20px;
            background: #1f8f4e;
            padding: 12px 18px;
            border-radius: 10px
        }

        body {

            opacity: 0;

            animation: pageLoad 1s ease forwards;

        }

        @keyframes pageLoad {

            from {

                opacity: 0;
                transform: scale(.98);

            }

            to {

                opacity: 1;
                transform: scale(1);

            }

        }

        .sidebar {

            transform: translateX(-100px);

            opacity: 0;

            animation: sidebar .8s ease forwards;

        }

        @keyframes sidebar {

            to {

                transform: none;

                opacity: 1;

            }

        }

        .main h1 {

            opacity: 0;

            transform: translateY(30px);

            animation: title .8s .3s forwards;

        }

        @keyframes title {

            to {

                opacity: 1;

                transform: none;

            }

        }

        .card {

            opacity: 0;

            transform: translateY(40px);

            animation: card .8s forwards;

            transition: .4s;

        }

        .card:nth-child(1) {

            animation-delay: .3s;

        }

        .card:nth-child(2) {

            animation-delay: .5s;

        }

        .card:nth-child(3) {

            animation-delay: .7s;

        }

        .card:nth-child(4) {

            animation-delay: .9s;

        }

        @keyframes card {

            to {

                opacity: 1;

                transform: none;

            }

        }

        .card:hover {

            transform: translateY(-10px);

            box-shadow:

                0 20px 40px rgba(0, 0, 0, .4),

                0 0 30px rgba(245, 197, 66, .15);

            border-color: #f5c542;

        }

        .card {

            animation:

                card .8s forwards,

                floating 6s ease-in-out infinite;

        }

        @keyframes floating {

            0%,
            100% {

                transform: translateY(0);

            }

            50% {

                transform: translateY(-8px);

            }

        }

        .panel {

            opacity: 0;

            transform: translateY(50px);

            animation: panel .8s 1.1s forwards;

        }
        .panel li , th, td{

            padding: 12px 12px;

        }

        @keyframes panel {

            to {

                opacity: 1;

                transform: none;

            }

        }

        tr {

            transition: .35s;

        }

        tr:hover {

            background: #1f2531;

        }

        .chat {

            transition: .4s;

            animation: pulse 2s infinite;

        }

        .chat:hover {

            transform: translateY(-5px) scale(1.05);

        }

        @keyframes pulse {

            0% {

                box-shadow: 0 0 0 0 rgba(245, 197, 66, .5);

            }

            70% {

                box-shadow: 0 0 0 20px rgba(245, 197, 66, 0);

            }

            100% {

                box-shadow: 0 0 0 0 rgba(245, 197, 66, 0);

            }

        }

        .toast {

            transform: translateX(120%);

            opacity: 0;

            transition: .5s;

        }

        .toast.show {

            display: block;

            transform: translateX(0);

            opacity: 1;

        }
    </style>
</head>

<body>
    <div class="sidebar">
        <div class="logo">PROP65</div>
        <div class="menu"><a class="active">🏠 Dashboard</a></div>
    </div>
    <div class="main">
        <h1>Welcome back 👋</h1>
        <div class="cards">
            <div class="card">
                <div>Products</div>
                <div class="num">247</div>
            </div>
            <div class="card">
                <div>Compliance</div>
                <div class="num">96%</div>
            </div>
            <div class="card">
                <div>Alerts</div>
                <div class="num">5</div>
            </div>
            <div class="card">
                <div>Reports</div>
                <div class="num">1426</div>
            </div>
        </div>
        <div class="grid">
            <div class="panel">
                <h2>Recent Products</h2>
                <table width="100%">
                    <tr>
                        <th align=left>Product</th>
                        <th>Status</th>
                    </tr>
                    <tr>
                        <td>Battery Pack</td>
                        <td>Pending</td>
                    </tr>
                    <tr>
                        <td>Cosmetic Cream</td>
                        <td>Reviewed</td>
                    </tr>
                </table>
            </div>
            <div class="panel">
                <h2>Recent Activity</h2>
                <ul>
                    <li>AI scanned 24 products</li>
                    <li>3 reports exported</li>
                    <li>California list updated</li>
                </ul>
            </div>
        </div>
    </div>
    <div class="chat"
        onclick="let t=document.getElementById('t');t.style.display='block';setTimeout(()=>t.style.display='none',2000)">
        🤖 Ask AI</div>
    <div id="t" class="toast">Demo AI Assistant</div>
    <script>
        document.querySelectorAll(".num").forEach(num => {

            const target = parseInt(num.innerText);

            let current = 0;

            const timer = setInterval(() => {

                current += Math.ceil(target / 40);

                if (current >= target) {

                    current = target;

                    clearInterval(timer);

                }

                num.innerText = current + (num.innerText.includes("%") ? "%" : "");

            }, 40);

        });
        const t = document.getElementById("t");

        t.classList.add("show");

        setTimeout(() => {

            t.classList.remove("show");

        }, 2000);
    </script>
</body>

</html>
